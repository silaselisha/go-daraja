name: Refresh built site

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: refresh-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build docs
        run: mkdocs build --strict --site-dir site-build

      - name: Refresh site directory
        run: |
          mkdir -p site
          rsync -a --delete site-build/ site/
          rm -rf site-build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(docs): refresh built site"
          title: "chore(docs): refresh built site"
          body: "Automated refresh of the built MkDocs site."
          branch: chore/refresh-site
          base: master
          delete-branch: true
